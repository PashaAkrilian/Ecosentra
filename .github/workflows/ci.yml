name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [develop, staging, main]

# Batalkan run lama di branch/PR yang sama saat ada push baru.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web — lint, type-check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      # Build TIDAK membutuhkan kredensial AWS/Anthropic: aplikasi dibangun
      # dalam mode demo (klien AWS dibuat malas, saat dibutuhkan).
      - name: Build
        run: npm run build

      # Hanya gagal untuk kerentanan KRITIS pada dependency produksi; temuan lain
      # dipantau lewat Dependabot (sebagian berada di dependency transitif yang
      # belum punya perbaikan upstream).
      - name: Audit dependency produksi
        run: npm audit --omit=dev --audit-level=critical

  web-emulator:
    name: Web — integrasi DynamoDB (emulator Moto)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci
        working-directory: apps/web

      # Moto menirukan DynamoDB; uji menjalankan server/store.ts yang SESUNGGUHNYA terhadapnya
      # (kunci/kondisi/pembaruan, isolasi antar pengguna, hapus massal, batas daftar).
      - name: Jalankan emulator DynamoDB
        run: |
          pip install 'moto[server]'
          (AWS_ACCESS_KEY_ID=test AWS_SECRET_ACCESS_KEY=test nohup moto_server -H 127.0.0.1 -p 5555 > moto.log 2>&1 &)
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:5555/moto-api/ && break; sleep 1; done

      - name: Uji integrasi
        run: npm run test:emulator
        working-directory: apps/web
        env:
          DYNAMODB_ENDPOINT: http://127.0.0.1:5555
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test

  geo:
    name: services/geo — ruff & pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/geo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/geo/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  mcp:
    name: services/mcp — ruff & pytest (termasuk uji protokol stdio)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/mcp/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  docker:
    name: Docker — build image services
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        service: [geo, mcp]
    steps:
      - uses: actions/checkout@v4
      - name: Build services/${{ matrix.service }}
        run: docker build --tag ecosentra-${{ matrix.service }}:ci services/${{ matrix.service }}

  docker-web:
    name: Docker — build image web (standalone)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Build mengunduh font Google, jadi butuh internet. NEXT_PUBLIC_* sengaja kosong: image mode demo.
      - name: Build apps/web
        run: docker build --tag ecosentra-web:ci apps/web
