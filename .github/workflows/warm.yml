name: Warm cache

# Memanaskan cache Redis tiap 10 menit lewat /api/cron/warm.
# Butuh secret SITE_URL (mis. https://ecosentra.vercel.app) dan CRON_SECRET (sama dengan env Vercel).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE_URL: ${{ secrets.SITE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Lewati jika secret belum diisi
        if: env.SITE_URL == '' || env.CRON_SECRET == ''
        run: echo "::warning::SITE_URL/CRON_SECRET belum diisi; pemanasan dilewati."
      - name: Panggil route warm
        if: env.SITE_URL != '' && env.CRON_SECRET != ''
        run: |
          curl --fail --silent --show-error --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/warm"
